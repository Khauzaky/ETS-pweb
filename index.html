<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver ojol Manajemen</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Money Management</h1>
        <nav>
            <a href="">Tambah Transaksi</a>
            <a href="">Riwayat Transaksi</a>
        </nav>
    </header>
    <main>
        <div class="katru_pendapatan">
            <div class="kp dapatbersih"> Pendapatan bersih:</div>
            <div class="kp saldo"> Rp 0</div>
            <span class="kp pemasukan"> Pemasukan: Rp 0</span>
            <span class="kp operasional">Biaya Operasional: Rp 0</span>
            <span class="kp pribadi">Biaya Pribadi: Rp 0</span>
        </div>

        <div class="kartu_saldo">
            <div class="kartu kartu-total">
                <p>total Saldo</p>
                <p>Rp 0</p>
            </div>
            <div class="kartu kartu-masuk">
                <p>Pemasukan</p>
                <p>Rp 0</p>
            </div>
            <div class="kartu kartu-keluar">
                <p>Pengeluaran</p>
                <p>Rp 0</p>
            </div>
        </div>

        <form id="transaksi">
            <h2 class="h2_trans">Catat Transaksi Baru</h2>
            <div id="erms"></div>
            <div class="trans form">
                <label for="tgl"> Tanggal Transaksi</label>
                <input type="date" name="tgl" id="tgl" required>
            </div>
            <div class="trans form">
                <label for="jenis">Jenis Transaksi</label>
                <select name="jenis" id="jenis" required>
                    <option value="Pemasukan">Pemasukan</option>
                    <option value="Pengeluaran">Pengeluaran</option>
                </select>
            </div>
            <div class="trans form">
                <label for="kategori"> Kategori</label>
                <select name="kategori" id="kategori">
                    <option value="operasional">(Maintenance/bengkel)Operasional</option>
                    <option value="operasional">(Bensin)Operasional</option>
                    <option value="operasional">(beli barang untuk ngojek)Operasional</option>
                    <option value="pribadi">Pribadi</option>
                    <option value="pribadi">Keluarga</option>
                </select>
            </div>
            <div class="trans form">
                <label for="nominal">Nominal (Rp)</label>
                <input type="number" id="nominal" name="nominal" min="1" placeholder="Contoh: 50000" required>
            </div>
            <div class="trans form">
                <label for="catatan">Catatan</label>
                <input type="text" id="catatan" name="catatan" placeholder="Misal: Isi bensin">
            </div>
            <button type="submit" class="btn-simpan">Tambah Transaksi</button>
        </form>

        <div class="daftar">
            <h2 class="h2_trans"> Riwayat Transaksi</h2>
            <div id="daftranss"></div>
        </div>
    </main>
</body>
</html>
